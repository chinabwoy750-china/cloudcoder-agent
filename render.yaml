services:
  - type: web
    name: universal-modder
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # Auth only — Provider, GitHub, Telegram are configured in Admin dashboard
      - key: NODE_ENV
        value: production
      - key: CLOUDCODER_USERNAME
        sync: false
      - key: CLOUDCODER_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: OPENCODE_SERVER_USERNAME
        value: opencode
      - key: OPENCODE_SERVER_PASSWORD
        generateValue: true
      - key: WORKSPACE_ROOT
        value: /tmp/cloudcoder
      - key: OBJECT_STORAGE_PATH
        value: /tmp/cloudcoder.objects
      - key: LOG_LEVEL
        value: info
      - key: ALLOW_PUBLIC_REGISTRATION
        value: "false"
      - key: DOCKER_ISOLATION
        value: "false"
      - key: DATABASE_URL
        sync: false
      # Optional durable settings store (recommended on free Render disk)
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

# Provider (CUSTOM_AI_*), GitHub, and Telegram secrets are managed in the
# in-app Admin panel after login. Env vars remain optional fallbacks only.
